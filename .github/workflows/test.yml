name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Release integration (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n scripts/release.sh
      - name: Install test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/release-tests"
          "$RUNNER_TEMP/release-tests/bin/python" -m pip install -r requirements-dev.txt
          echo "$RUNNER_TEMP/release-tests/bin" >> "$GITHUB_PATH"
      - name: Test release behavior without publishing
        run: python3 -m unittest discover -s tests -v
      - name: Verify composite action rejects a branch invocation
        id: non-tag
        uses: ./
        continue-on-error: true
      - name: Check rejection
        env:
          OUTCOME: ${{ steps.non-tag.outcome }}
        run: test "$OUTCOME" = failure
